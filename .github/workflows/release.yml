name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build: npm run electron:build:win
            artifact_name: notebook-windows
          - os: macos-latest
            build: npm run electron:build:mac
            artifact_name: notebook-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Build API
        run: cargo build --release -p notebook-api

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build desktop installer
        working-directory: apps/desktop
        run: ${{ matrix.build }}

      - name: Collect installer artifacts
        shell: bash
        run: |
          mkdir -p installers
          shopt -s nullglob
          for file in apps/desktop/release/*.dmg apps/desktop/release/*.exe apps/desktop/release/*.blockmap; do
            cp "$file" installers/
          done
          ls -la installers/
          if [ -z "$(ls -A installers)" ]; then
            echo "No installer artifacts found in apps/desktop/release"
            ls -la apps/desktop/release || true
            exit 1
          fi

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: installers/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve release version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Notebook ${{ steps.version.outputs.tag }}
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.blockmap
