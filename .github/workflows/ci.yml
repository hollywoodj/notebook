name: Notebook CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build API and CLI
        run: cargo build --release -p notebook-core -p notebook-api -p notebook-cli
      - name: Run tests
        run: cargo test -p notebook-core
      - name: Smoke test API + CLI
        run: |
          ./target/release/notebook-api &
          API_PID=$!
          sleep 2
          ./target/release/notebook --api http://127.0.0.1:8799 info
          ./target/release/notebook --api http://127.0.0.1:8799 notebook list
          kill $API_PID
